<!DOCTYPE html>
<html>
	<head>
		<style>
		img {
		  position: absolute;
		  left: 0px;
		  z-index: -1;
		}
		</style>
	</head>
	<body>

		<h1>The z-index Property</h1>

		<img src="https://static.vecteezy.com/vite/assets/photo-masthead-375-BoK_p8LG.webp" width="100" height="140">
		
		<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

	</body>
</html>
