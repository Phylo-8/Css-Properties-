<!DOCTYPE HTML>

<html>
	<head>
		<title></title>
		<style>
			.durva{
				display:none;
				border:1px solid black;
				width:20%;
				height:100%;
				text-align:center;
				margin-top:2%;
				box-shadow: 2px 3px 10px black;
				padding:1%;
			}
			.srnm{
				display:none;
				border:1px solid black;
				width:20%;
				height:100%;
				text-align:center;
				margin-top:2%;
				box-shadow: 2px 3px 10px black;
				padding:1%;
			}
			.ho
			{
				width:10%;
				height:100%;
				background-color:black;
				color:red;
				border-radius:4px;
				text-align:center;
				padding:1%;
			}
				
			.drop:hover .durva
			{
				display:block;
			}
			
			.drop:hover .srnm
			{
				display:block;
			}
		</style>
	</head>
	<body>
		<div class="drop">
			<div class="ho">
				Hover
			</div>
			<div class="durva">
				Durva
			</div>
		</div>
	</body>
</html>
