<!DOCTYPE HTML>
<html>
	<head>
		<title>
			multicolumns
		</title>
		
		<style>
			.div{
				column-width:300px;
				column-count:3;
				column-rule:5px ridge blue;
				column-gap:5;
				
			}
			h1{
				column-span:all;
			}
		</style>
	</head>
	<body>
		<div class="div">
			<h1>Heading</h1>
			<p>hello</p>
			<p>hello</p>
			<p>hello</p>
			<p>hello</p>
		</div>
		
	</body>
</html>
